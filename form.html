<!DOCTYPE html>
<html lang="id">
<head>
    <title>Form Pendaftaran Akun</title>
</head>
<body>

    <header>
        <table border="1" cellpadding="6" cellspacing="0" width="100%">
            <tr>
                <td align="center"><a href="../IMDB.Charts/index.html">IMDb</a></td>
                <td align="center"><a href="../DevBlogs/blog.html">Dev Blogs</a></td>
                <td align="center"><a href="form.html">Form Pendaftaran</a></td>
                <td align="center"><a href="../CurriculumVitae/cv.html">CV</a></td>
            </tr>
        </table>
    </header>

    <main>

        <h1>Form Pendaftaran Akun</h1>

        <fieldset>
            <legend>Daftar Akun</legend>

            <form onsubmit="return false;">
                <p>
                    <label>Nama Lengkap: <input type="text" name="nama"></label>
                </p>

                <hr>

                <p>
                    Jenis Kelamin:
                    <label><input type="radio" name="kelamin" value="laki-laki"> Laki-Laki</label>
                    <label><input type="radio" name="kelamin" value="perempuan"> Perempuan</label>
                </p>

                <hr>

                <p>
                    <label>Tempat Lahir: <input type="text" name="tempat_lahir"></label>
                </p>

                <hr>

                <p>
                    <label>Tanggal Lahir: <input type="date" name="tanggal_lahir"></label>
                </p>

                <hr>

                <p>
                    <label>
                        Agama:
                        <select name="agama">
                            <option value="">--- Pilih Agama ---</option>
                            <option value="islam">Islam</option>
                            <option value="katolik">Katolik</option>
                            <option value="protestan">Protestan</option>
                            <option value="hindu">Hindu</option>
                            <option value="buddha">Buddha</option>
                            <option value="konghucu">Konghucu</option>
                        </select>
                    </label>
                </p>

                <hr>

                <p>
                    Hobi:
                    <label><input type="checkbox" name="hobi" value="olahraga"> Olahraga</label>
                    <label><input type="checkbox" name="hobi" value="membaca"> Membaca</label>
                    <label><input type="checkbox" name="hobi" value="ngoding"> Ngoding</label>
                </p>

                <hr>

                <p>
                    <label>Password: <input type="password" name="password"></label>
                </p>

                <hr>

                <p>
                    <label>
                        <input type="checkbox" name="setuju" value="ya">
                        Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.
                    </label>
                </p>

                <hr>

                <p>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </p>
            </form>
        </fieldset>

    </main>

</body>
</html>
